name: Manual verification

on:
  # GitHub-hosted runners are intentionally not part of the active release
  # path. Release candidates are verified locally, then deployed and checked
  # through Vercel. Keep this workflow available for an operator to re-enable
  # once hosted-runner billing is available again.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
